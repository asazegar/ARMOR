armor:
  node:
    id: "edge-node-01"
    environment: "production"
    zone: "us-east-1"
  
  collectors:
    falco:
      enabled: true
      socket_path: "/var/run/falco/falco.sock"
      log_level: "info"
    
    zeek:
      enabled: true
      interface: "eth0"
      log_dir: "/var/log/zeek"

  transport:
    protocol: "nats"
    endpoint: "nats://core-bus.armor.internal:4222"
    batch_size: 100
    flush_interval_ms: 500
    tls:
      enabled: true
      cert_file: "/etc/armor/certs/agent.crt"
      key_file: "/etc/armor/certs/agent.key"